# A release: push a version tag (git tag v1.2.0 && git push origin v1.2.0).
# It builds the binaries (and attaches install.sh, compose.yaml, compose.proxy.yaml and the
# Caddyfile, which the installer fetches), signs their SHA256SUMS with the release key (the
# RELEASE_SIGNING_KEY secret: the masters' updater installs nothing else),
# and then publishes the GitHub release, which the masters see within their
# MASTER_UPDATE_INTERVAL. (OpenH1's fork: no image; RELEASE_SIGNING_KEY is
# the master release key's seed, whose public half is internal/update/key.go.
# Its versions: v<upstream major>.<upstream minor>.1<upstream patch, two
# digits><the fork's revision, two digits>, v0.1.10801 for upstream's v0.1.8
# and the fork's first.)
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # the latest patch of go.mod's Go: the standard library's fixes
          go-version: "1.26.x"
          check-latest: true
      - name: the tag is a version (v1.2.3)
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: go vet and go test
        run: go vet ./... && go test -race ./...
      - name: known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: binaries
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 linux/arm/7; do
            IFS=/ read -r os arch arm <<< "$target"
            name="opence-master-$os-$arch${arm:+v$arm}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -trimpath -ldflags "-s -w \
              -X github.com/OpenCommunityEdition/opence-master-server/internal/core.Version=$GITHUB_REF_NAME" \
              -o "dist/$name" ./cmd/opence-master
          done
          ./dist/opence-master-linux-amd64 version | grep -q " $GITHUB_REF_NAME "
          # (the installer and the files it fetches)
          cp install.sh compose.yaml compose.proxy.yaml dist/ && cp deploy/Caddyfile dist/Caddyfile
          (cd dist && sha256sum opence-master-* install.sh compose.yaml compose.proxy.yaml Caddyfile > SHA256SUMS)
      - name: sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          go run ./cmd/release-sign sign dist/SHA256SUMS
          go run ./cmd/release-sign verify dist/SHA256SUMS
      - name: the GitHub release (last, so the masters see it once everything is out)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
